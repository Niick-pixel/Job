name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt cryptography
      - name: Tests del backend
        run: cd backend && python -m pytest -q
      - name: Tests del instalador / OTA
        run: cd installer && python -m pytest -q
