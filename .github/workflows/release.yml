# Publica una versión OTA de dos formas:
#   - empujando un tag:   git tag v0.2.1 && git push origin v0.2.1
#   - desde GitHub:       Actions → Release → Run workflow (crea el tag vX.Y.Z a partir de VERSION)
# Las instalaciones existentes la detectarán en ≤ 6 h (o al pulsar «Actualizar ahora»).
name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Determinar el tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$TAG" = "$GITHUB_REF_NAME" || { echo "::error::VERSION=$(cat VERSION) pero el tag es $GITHUB_REF_NAME"; exit 1; }
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La release $TAG ya existe: sube VERSION antes de publicar"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: pip install -r requirements.txt cryptography
      - run: cd backend && python -m pytest -q
      - run: cd installer && python -m pytest -q
      - name: Construir y firmar la release
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python scripts/release.py --out dist \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.tag }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/

  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Construir el .pkg
        run: installer/pkg/build_pkg.sh dist
      - name: Probar install.sh en macOS real
        run: |
          VERSION="$(cat VERSION)"
          JOBTRACKER_NO_START=1 bash dist/install.sh --non-interactive \
            --tarball "dist/jobtracker-ai-$VERSION.tar.gz" --manifest dist/manifest.json
          ~/.local/bin/jobtracker status
          test -f "$HOME/Applications/JobTracker AI.app/Contents/Info.plist"
      - name: Probar servicios con launchd
        continue-on-error: true  # algunos runners no tienen sesión gráfica (dominio gui/)
        run: |
          ~/.local/bin/jobtracker start
          curl -fsS --retry 60 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health
          ~/.local/bin/jobtracker stop
      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: dist/*.pkg

  publish:
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 -c 'import json; print(json.load(open("dist/manifest.json"))["notes"] or "Mejoras y correcciones.")' > notes.md
          # Se crea como borrador y se publica al final: así `latest/download/manifest.json`
          # nunca apunta a una release a medio subir.
          # --target: si el tag no existe (publicación desde Actions), se crea en este commit
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "JobTracker AI ${TAG#v}" --notes-file notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
